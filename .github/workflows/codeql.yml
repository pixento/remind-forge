name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because CodeQL ships new queries between commits.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # build-mode: none is Java-only - with Kotlin present it analyses nothing and merely warns,
      # and this module is 100% Kotlin. So the database comes from a real compile.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # --no-build-cache because the extractor hooks the Kotlin compiler: a compileDebugKotlin that
      # resolves FROM-CACHE contributes nothing and would leave an empty database behind a green run.
      - run: ./gradlew assembleDebug --no-build-cache

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
