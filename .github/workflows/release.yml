name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full gate - unit tests, lint, and the instrumented matrix on API 24 and 34.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish signed bundle
    needs: verify
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # Play shows the version name to testers; the tag's leading "v" is repo convention, not part
      # of the version. Version code is the run number - monotonic, and never reused.
      - name: Derive version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Written to the runner temp dir, never the working tree, so no build or upload step can
      # sweep it up.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Kept unconditionally, so the very first release - which Google requires be uploaded through
      # the Console by hand - can just be downloaded from here.
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Leaves an already-existing release (e.g. one a human has since hand-edited with real notes)
      # untouched - this only fills in the gap for a tag that has no release yet.
      - name: Ensure a GitHub Release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes

      # --clobber makes this idempotent if the job is re-run for the same tag.
      - name: Upload the signed bundle to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/bundle/release/app-release.aab --clobber

      # Stays dormant until the manual first upload has created the app's first release; see the
      # Releasing section in README.md.
      - name: Upload to Play internal track
        if: vars.PLAY_PUBLISH_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.pixento.betterhabits
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # Drawn on the JVM through Robolectric, so this needs no emulator and no signing material -
  # deliberately outside the google-play environment, whose secrets and protection rules it has no
  # use for. Job-level permissions don't inherit from publish, hence contents: write again.
  store-graphics:
    name: Play listing graphics
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Matches the unit test launcher pinned in app/build.gradle.kts, so the foojay resolver never
      # has to download a JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # The -P both narrows testDebugUnitTest to the renderers and switches Roborazzi from "no-op"
      # to "write files"; without it an ordinary test run does neither.
      - name: Render the listing graphics
        run: ./gradlew :app:testDebugUnitTest -PrecordStoreGraphics=true

      # gh release upload can't take a directory. The zip root is metadata/, the layout fastlane
      # supply and the Play Console both expect.
      - name: Pack the graphics
        run: |
          ( cd app/build/outputs/store-graphics && \
            zip -r -q "$RUNNER_TEMP/store-graphics-$GITHUB_REF_NAME.zip" metadata )

      # The raw tree as well, so it's browsable in the Actions UI without a zip inside a zip.
      - name: Upload graphics artifact
        uses: actions/upload-artifact@v7
        with:
          name: store-graphics
          path: app/build/outputs/store-graphics/metadata

      # Repeated from publish so this job stays runnable on its own for a tag that already shipped.
      - name: Ensure a GitHub Release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes

      # --clobber makes this idempotent if the job is re-run for the same tag.
      - name: Upload the graphics to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/store-graphics-$GITHUB_REF_NAME.zip" --clobber
