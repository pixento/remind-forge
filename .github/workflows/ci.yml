name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 covers both the daemon (gradle/gradle-daemon-jvm.properties) and the unit test
      # launcher pinned in app/build.gradle.kts, so the foojay resolver never has to download one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest supports nested virtualisation, but /dev/kvm isn't world-writable by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 rather than the compileSdk: espresso-core is pinned to 3.7.0 because newer platform
      # images removed InputManager.getInstance (see app/build.gradle.kts), and the Robolectric
      # config pins the same level. minSdk is 24, so the app runs here fine.
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
